name: ecopoint_pro
description: EcoPoint Pro â€” native Flutter app for recycling rewards (EP points), smart bins and eco impact.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Firebase (FlutterFire) â€” versions are a mutually compatible set
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_database: ^11.3.1
  http: ^1.2.2
  google_sign_in: ^6.2.2
  firebase_messaging: ^15.1.6

  # Native capabilities
  mobile_scanner: ^6.0.2
  permission_handler: ^11.3.1
  geolocator: ^13.0.2

  # Map (OpenStreetMap tiles, no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI & utilities
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# `dart run flutter_launcher_icons` generates the Android launcher icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/logo_full.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 23
