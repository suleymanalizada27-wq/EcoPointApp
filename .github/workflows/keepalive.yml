# GitHub turns scheduled workflows off after 60 days without repository activity.
# This monthly job re-enables push-tick so notifications keep flowing.
name: keepalive
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable push-tick.yml --repo "$GITHUB_REPOSITORY" || true
