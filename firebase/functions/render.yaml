# Render blueprint (https://render.com). Free plan; UptimeRobot + the app keep it awake.
# The repo root package.json delegates build/start to firebase/functions.
services:
  - type: web
    name: ecopoint-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: QR_HMAC_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_EMAILS
        value: greenlinegroup2026@gmail.com
      - key: CONTACT_EMAIL
        value: greenlinegroup2026@gmail.com
      - key: APP_DOWNLOAD_URL
        sync: false
